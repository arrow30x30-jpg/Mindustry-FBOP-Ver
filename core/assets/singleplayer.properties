# Mindustry Single-Player Configuration
# This file contains all configuration needed for the single-player only version

# Disable all multiplayer features
multiplayer.enabled=false
networking.enabled=false
server.hosting.enabled=false
client.connection.enabled=false

# Disable chat
chat.enabled=false
player.list.enabled=false

# Disable network sync
network.sync.enabled=false
network.packets.enabled=false

# Single player defaults
game.mode=singleplayer
default.team=sharded
allow.player.switching=true

# Disable server list
server.list.enabled=false
server.discovery.enabled=false
server.connection.enabled=false

# Steam integration disabled
steam.enabled=false
steam.lobbies.enabled=false
